        - title: "Mixed-Integer Nonlinear Differentiable Predictive Control for Underground Pumped Hydro Energy Storage Systems"
          abstract_id: "arxiv-2609.17964"
          abstract_order: 37
          abstract_summary: "Underground pumped-hydro scheduling combines nonlinear hydraulic dynamics with discrete pump, idle, and turbine modes. This self-supervised framework trains a Transformer policy to produce operating modes and continuous power setpoints through a two-pass differentiable simulator. Straight-through Gumbel-Softmax decisions and parallel training rollouts connect mixed-integer schedules to the day-ahead operating objective without requiring labeled optimal schedules."
          image: "images/papers/v6/arxiv-2609.17964.png"
          image_animated: "images/papers/v6/arxiv-2609.17964.svg"
          image_static: "images/papers/v6/arxiv-2609.17964-static.svg"
          image_alt: "Train a Transformer policy through straight-through Gumbel-Softmax decisions and a two-pass differentiable simulator. Direct learned mixed-integer schedules with temporal attention and parallel training rollouts. Motion illustrates algorithm steps or system behavior; it does not reproduce reported numerical results."
          image_fit: "contain"
          abstract_links: [{"text": "Paper", "url": "https://arxiv.org/abs/2609.17964"}, {"text": "Code", "url": "https://github.com/SOLARIS-JHU/MI-DPC-UPHES"}, {"text": "Website", "url": "https://solaris-jhu.github.io/MI-DPC-UPHES/"}]
          abstract_scope: "Illustrative graphical abstract: motion explains the method and does not reproduce measured results or benchmark timing."
          abstract_animation: "Fixed logits (0.15,-0.05,0.05) and reproducible independent Gumbel draws g=-log(-log U) generate s=softmax((logits+g)/tau) at 81 temperatures decreasing geometrically from 5 to 0.05. Points are true barycentric combinations of the P/I/T vertices and are colored by invariant hard mode. The finite-temperature near-tie samples correctly remain partly mixed instead of being snapped to vertices. This matches the project-page illustration, not its two-stage training schedule or measured mode frequencies."
          abstract_sources: [{"url": "https://arxiv.org/html/2609.17964v1", "locator": "Sections III-B–III-E; Algorithms 1–2; Eqs. (4), (5), (10), (13)–(15); Algorithms 1–2"}, {"url": "https://github.com/SOLARIS-JHU/MI-DPC-UPHES/blob/main/DPC/system.py", "locator": "build_oneshot_system"}, {"url": "https://solaris-jhu.github.io/MI-DPC-UPHES/", "locator": "Differentiable mode selection"}]
          venue: "IEEE CDC 2026"
          summary: "A self-supervised mixed-integer control policy for nonlinear pumped-hydro scheduling, using differentiable simulation, Transformers, and Gumbel-Softmax decisions."
