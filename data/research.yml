        - title: "Zero-Shot Function Encoder-Based Differentiable Predictive Control"
          abstract_id: "arxiv-2511.05757"
          abstract_order: 12
          abstract_summary: "A learned controller must adapt when system dynamics change. This framework learns neural-ODE basis functions and trains a differentiable predictive-control policy conditioned on the resulting dynamics coefficients. Online state-action transitions identify new coefficients while the neural models remain fixed, allowing adaptation within the learned dynamics representation without retraining the control policy."
