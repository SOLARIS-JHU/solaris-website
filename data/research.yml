        - title: "Learning to Solve Parametric Mixed-Integer Optimal Control Problems via Differentiable Predictive Control"
          abstract_id: "arxiv-2506.19646"
          abstract_order: 10
          abstract_summary: "Mixed-integer optimal control combines continuous actions with discrete operating decisions. This differentiable predictive-control framework trains a shared neural policy with separate continuous and discrete outputs through model-based rollouts. It compares differentiable rounding strategies that use hard decisions in the forward pass and surrogate gradients in training, enabling explicit policies for parametric mixed-integer control problems."
          image: "images/papers/v6/arxiv-2506.19646.png"
          image_animated: "images/papers/v6/arxiv-2506.19646.svg"
          image_static: "images/papers/v6/arxiv-2506.19646-static.svg"
          image_alt: "A shared policy splits into continuous and discrete outputs. Hard discrete decisions use surrogate gradients during offline rollout-based predictive training. Compare three differentiable rounding strategies within mixed-integer policy learning. Motion illustrates algorithm steps or system behavior; it does not reproduce reported numerical results."
