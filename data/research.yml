    - year: 2024
      papers:
        - title: "Learning to Optimize for Mixed-Integer Nonlinear Programming with Feasibility Guarantees"
          abstract_id: "arxiv-2410.11061"
          abstract_order: 4
          abstract_summary: "Mixed-integer nonlinear programs require decisions that satisfy both integrality and nonlinear constraints. This framework learns relaxed solutions, applies an adaptive integer-correction layer, and refines candidates through iterative constraint-violation updates at inference. By separating integrality enforcement from feasibility refinement, it supports learned solution maps for parametric problems while accounting for the conditions and approximation errors underlying feasibility guarantees."
          image: "images/papers/v6/arxiv-2410.11061.png"
          image_animated: "images/papers/v6/arxiv-2410.11061.svg"
          image_static: "images/papers/v6/arxiv-2410.11061-static.svg"
          image_alt: "A learned relaxed solution passes through integer correction. At inference, iterative violation-gradient updates alternate with the learned rounding layer. Separate learned integrality enforcement from inference-time feasibility refinement. Motion illustrates algorithm steps or system behavior; it does not reproduce reported numerical results."
          image_fit: "contain"
          abstract_links: [{"text": "Paper", "url": "https://arxiv.org/abs/2410.11061"}, {"text": "Code", "url": "https://github.com/pnnl/L2O-MINLP"}]
          abstract_scope: "Illustrative graphical abstract: motion explains the method and does not reproduce measured results or benchmark timing."
          abstract_animation: "The displayed sequence alternates relaxed candidates with integer-corrected candidates and then rechecks constraint violation. All points are schematic. A feasible-looking endpoint illustrates an operation, not a universal finite-iteration guarantee."
          abstract_sources: [{"url": "https://arxiv.org/html/2410.11061v10", "locator": "Sections 4.2-4.3; Algorithms 1-2; Section 5 Remark 1 and Assumptions 1-2; Eq. 2; Algorithms 1–2; Sections 4.2–4.3 and theory qualifications"}, {"url": "https://github.com/pnnl/L2O-MINLP/blob/master/README.md", "locator": "Methodology"}, {"url": "https://github.com/pnnl/L2O-MINLP/blob/master/src/postprocess/project.py", "locator": "gradientProjection.forward"}]
          summary: "A learning-to-optimize framework for parametric MINLP that combines adaptive integer correction with projections to guarantee feasibility."
          authors: "Bo Tang, Elias B. Khalil, Ján Drgoňa"
          links:
            - text: "Preprint"
              url: "https://arxiv.org/abs/2410.11061"
            - text: "GitHub"
              url: "https://github.com/pnnl/L2O-MINLP"

- area: "Learning to Control"
  description: "Data-driven control policies for constrained nonlinear and distributed systems, trained through differentiable predictive control and operator learning."
  years:
    - year: 2026
      papers:
        - title: "SD-DPC: Sparse Dictionary Differentiable Predictive Control"
          abstract_id: "arxiv-2610.02466"
          abstract_order: 5
          abstract_summary: "Compact feedback policies can make nonlinear control easier to interpret and deploy. SD-DPC identifies sparse dynamics and trains a policy expressed in a candidate-function dictionary through predictive closed-loop rollouts. Coefficient pruning and refitting produce an explicit sparse feedback law, with policy terms selected for control performance rather than imitation of an expert controller."
          image: "images/papers/v6/arxiv-2610.02466.png"
          image_animated: "images/papers/v6/arxiv-2610.02466.svg"
          image_static: "images/papers/v6/arxiv-2610.02466-static.svg"
          image_alt: "Identify sparse dynamics from rollout errors, train a dictionary policy through predictive rollouts, prune coefficients, then refit retained terms. Select policy terms by closed-loop performance rather than teacher imitation. Motion illustrates algorithm steps or system behavior; it does not reproduce reported numerical results."
          image_fit: "contain"
          abstract_links: [{"text": "Paper", "url": "https://arxiv.org/abs/2610.02466"}, {"text": "Code", "url": "https://github.com/SOLARIS-JHU/SD-DPC"}, {"text": "Website", "url": "https://solaris-jhu.github.io/SD-DPC-website/"}]
          abstract_scope: "Illustrative graphical abstract: motion explains the method and does not reproduce measured results or benchmark timing."
          abstract_animation: "Paired rollout/reference errors and red excess beyond a green admissible interval shrink during illustrative policy learning. The band itself is fixed; penalties do not guarantee feasibility for arbitrary learned policies. The sparse policy and model structure remains unchanged."
          abstract_sources: [{"url": "https://arxiv.org/html/2610.02466v2", "locator": "Sections III-A to III-D; Algorithm 1; Assumption 1; Eqs. 4–10; Sections III-A to III-C; Algorithm 1"}, {"url": "https://github.com/SOLARIS-JHU/SD-DPC/blob/main/README.md", "locator": "Method"}, {"url": "https://github.com/SOLARIS-JHU/SD-DPC/blob/main/src/sdpc/training/policy.py", "locator": "build_policy_problem; train_policy; build_policy_problem and train_policy: sparse l1 objective, bounded_action, pruning trainer"}, {"url": "https://solaris-jhu.github.io/SD-DPC-website/", "locator": "Project page; Methodology; Algorithm 1; Sparse identification; Sparse dictionary policy; Policy learning"}, {"url": "https://github.com/SOLARIS-JHU/SD-DPC-website/blob/main/static/images/method.png", "locator": "Official graphical abstract: policy and SINDy above features, sequential thresholding, and control objective"}, {"url": "https://github.com/SOLARIS-JHU/SD-DPC/blob/main/src/sdpc/training/debias.py", "locator": "Fixed-support refit configuration; weights.l1_coef=0"}, {"url": "https://github.com/SOLARIS-JHU/SD-DPC/blob/main/src/sdpc/actions.py", "locator": "bounded_action and action_gradient_mask"}]
