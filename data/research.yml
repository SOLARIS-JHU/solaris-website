        - title: "Fixed-Time-Stable ODE Representation of Lasso"
          abstract_id: "arxiv-2604.02069"
          abstract_order: 20
          abstract_summary: "Sparse regression can be formulated as a continuous-time dynamical computation. This work splits Lasso coefficients into nonnegative variables, adds quadratic regularization, and constructs a Newton-based flow for the resulting quadratic program's optimality residuals. With strictly positive initialization, the flow gain sets a prescribed continuous-time settling bound for convergence to the sparse solution."
