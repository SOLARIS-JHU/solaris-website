<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ROSEI sponsor-card visual check</title>
  <style>
    html, body, iframe { width: 100%; height: 100%; margin: 0; border: 0; }
  </style>
</head>
<body>
  <iframe id="site" src="/#home-main" title="Homepage sponsor-card check"></iframe>
  <script>
    const frame = document.querySelector("#site");
    frame.addEventListener("load", () => {
      const doc = frame.contentDocument;
      const win = frame.contentWindow;
      doc.body.classList.remove("home-intro-active");
      doc.querySelector("[data-home-intro]")?.remove();
      doc.querySelectorAll(".sponsor-card:not(.sponsor-card--rosei)").forEach((card) => card.remove());
      doc.querySelectorAll(".sponsor-group[aria-hidden='true']").forEach((group) => group.remove());
      const viewport = doc.querySelector("[data-sponsor-marquee]");
      viewport?.classList.remove("is-scrolling");
      const section = doc.querySelector(".home-sponsors");
      section?.classList.add("is-visible");
      const style = doc.createElement("style");
      style.textContent = ".home-reveal { opacity: 1 !important; transform: none !important; transition: none !important; } .sponsor-track { animation: none !important; transform: none !important; }";
      doc.head.appendChild(style);
      window.setTimeout(() => section?.scrollIntoView({ block: "center" }), 250);
      window.setTimeout(() => win.dispatchEvent(new Event("resize")), 300);
    });
  </script>
</body>
</html>
