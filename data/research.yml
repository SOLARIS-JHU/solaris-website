      papers:
        - title: "A Koopman–Polynomial Chaos Framework for SMPC of Nonlinear Stochastic Processes"
          abstract_id: "arxiv-2610.24105"
          abstract_order: 13
          abstract_summary: "Nonlinear stochastic control must account for uncertain parameters and disturbances that evolve over time. This framework combines Koopman lifting with polynomial-chaos representations, then precomputes matrices for predicted moments, expected costs, and constraints. The resulting condensed convex control problem keeps online decision dimensions independent of the lifted-state and polynomial-basis sizes while retaining both sources of uncertainty."
          image: "images/papers/v6/arxiv-2610.24105.png"
          image_animated: "images/papers/v6/arxiv-2610.24105.svg"
          image_static: "images/papers/v6/arxiv-2610.24105-static.svg"
          image_alt: "Learn polynomial-chaos-parametrized Koopman dynamics; precompute moment matrices; solve a condensed convex control problem. Includes both fixed parametric uncertainty and changing stochastic disturbances. Motion illustrates algorithm steps or system behavior; it does not reproduce reported numerical results."
          image_fit: "contain"
          abstract_links: [{"text": "Paper", "url": "https://arxiv.org/abs/2610.24105"}]
          abstract_scope: "Illustrative graphical abstract: motion explains the method and does not reproduce measured results or benchmark timing."
          abstract_animation: "Computed feasible descent through a fixed toy quadratic. The highlighted contour is the current objective value, not a changing objective. Playback is paced for visibility rather than numerical solver timing; exact keyframes use piecewise-linear browser interpolation. The curved moment slice retains the stochastic problem’s QCQP interpretation."
          abstract_sources: [{"url": "https://arxiv.org/html/2610.24105v1", "locator": "Sections 4.1–4.3 and 5.1; Theorem 5; equations 34–35; Sections 4.1, 5.1; Eqs. (13), (14), (36); Theorem 5, Eq. (35a–d)"}]
          summary: "Polynomial-chaos Koopman models yield a condensed stochastic MPC formulation that handles uncertain parameters and disturbances without scaling online decisions with the lifted-state dimension."
