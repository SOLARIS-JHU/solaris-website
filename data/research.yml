          abstract_sources: [{"url": "https://arxiv.org/html/2603.28323v1", "locator": "Sections 3.1–3.4; Eqs. 7–8; Eqs. (1a), (1b), (7c)–(7g), (8)–(10); §3.3"}, {"url": "https://github.com/pnnl/MI-DPC/blob/master/MIDPC.py", "locator": "relaxed_binary, round_fn and Neuromancer node assembly"}, {"url": "https://xboldocky.github.io/chiller-plant-MIDPC/", "locator": "Methodology; Binary-Variance Regularization"}]
