        - title: "Fast-DeePC: Fast Data-Enabled Predictive Control using Soft-constrained Scheme"
          abstract_id: "arxiv-2610.12902"
          abstract_order: 14
          abstract_summary: "Data-enabled predictive control can become computationally expensive as the recorded trajectory dataset grows. Fast-DeePC replaces hard trajectory-consistency conditions with quadratic penalties and ridge regularization, allowing the trajectory coefficient vector to be eliminated offline. Online control then solves a fixed-size box-constrained quadratic program whose decision dimension does not grow with the dataset length."
          image: "images/papers/v6/arxiv-2610.12902.png"
          image_animated: "images/papers/v6/arxiv-2610.12902.svg"
          image_static: "images/papers/v6/arxiv-2610.12902-static.svg"
          image_alt: "Penalize trajectory consistency with quadratic terms and ridge regularization; eliminate coefficient vector g offline; solve a fixed-size box QP online. Decouples online decision dimension from offline dataset length. Motion illustrates algorithm steps or system behavior; it does not reproduce reported numerical results."
          image_fit: "contain"
          abstract_links: [{"text": "Paper", "url": "https://arxiv.org/abs/2610.12902"}]
          abstract_scope: "Illustrative graphical abstract: motion explains the method and does not reproduce measured results or benchmark timing."
          abstract_animation: "Computed feasible descent through a fixed toy quadratic. The highlighted contour is the current objective value, not a changing objective. Playback is paced for visibility rather than numerical solver timing; exact keyframes use piecewise-linear browser interpolation."
          abstract_sources: [{"url": "https://arxiv.org/html/2610.12902v1", "locator": "Section III, equations 8–15; III-A1 Woodbury reformulation; III-A2 penalty consistency; Eq. (10); Lemma 2, Eqs. (11–12); Section III-A condensed quadratic after substituting g*, and III-A1 Woodbury construction"}]
          summary: "A soft-constrained DeePC formulation eliminates trajectory coefficients offline, reducing online control to a fixed-size box-constrained quadratic program."
          authors: "Terry Zhang, Ján Drgoňa, Malika Sader, Di Liu, Liang Wu"
          links:
            - text: "Preprint"
              url: "https://arxiv.org/abs/2610.12902"

        - title: "Model Predictive Control for Safety-Critical Systems Using Taylor's Theorem with Lagrange Remainder"
          abstract_id: "arxiv-2610.06976"
          abstract_order: 15
          abstract_summary: "Safety-critical nonlinear MPC requires constraints that account for how a safety function evolves between prediction steps. This method uses Taylor's theorem and a numerically approximated integral remainder under zero-order-hold inputs to construct predictive safety constraints. A margin covering the approximation error connects the numerical remainder calculation to the stated sample-time safety condition."
          image: "images/papers/v6/arxiv-2610.06976.png"
          image_animated: "images/papers/v6/arxiv-2610.06976.svg"
          image_static: "images/papers/v6/arxiv-2610.06976-static.svg"
          image_alt: "Approximate the integral Taylor remainder under zero-order-hold inputs and impose a safety margin in predictive constraints. Uses an explicit remainder approximation to form the safety constraint. Motion illustrates algorithm steps or system behavior; it does not reproduce reported numerical results."
          image_fit: "contain"
          abstract_links: [{"text": "Paper", "url": "https://arxiv.org/abs/2610.06976"}]
          abstract_scope: "Illustrative graphical abstract: motion explains the method and does not reproduce measured results or benchmark timing."
          abstract_animation: "Discrete predicted sample checks do not assert continuous-time intersample safety."
          abstract_sources: [{"url": "https://arxiv.org/html/2610.06976v1", "locator": "Sections IV-A–IV-C; Remark 1; equations 14–20; Eq. (14); Eqs. (15–17); Remark 1, Eqs. (18–19)"}]
          summary: "Taylor expansions with a numerically approximated Lagrange remainder provide MPC safety constraints with fewer tuning parameters and reduced conservativeness."
          authors: "Shuo Liu, Liang Wu, Wei Xiao, Ján Drgoňa, Calin A. Belta"
          links:
            - text: "Preprint"
              url: "https://arxiv.org/abs/2610.06976"

        - title: "lapanda: A Matrix-Free Differentiable Solver for Nonconvex Constrained Optimization Layers"
          abstract_id: "arxiv-2609.33630"
          abstract_order: 16
          abstract_summary: "Learning through constrained optimization requires both a forward solution and sensitivities for an outer learning objective. Lapanda combines an augmented-Lagrangian outer loop with PANDA subproblem solves and matrix-free operators for differentiation. The resulting optimization layer handles general nonlinear constraints and nonconvex objectives, with local sensitivity results established under the stated regularity and optimality conditions."
          image: "images/papers/v6/arxiv-2609.33630.png"
          image_animated: "images/papers/v6/arxiv-2609.33630.svg"
          image_static: "images/papers/v6/arxiv-2609.33630-static.svg"
          image_alt: "An augmented-Lagrangian outer loop calls PANDA subproblem solves; the backward pass approximates optimizer sensitivities with matrix-free operators. Combines general constraints with matrix-free forward and backward computation. Motion illustrates algorithm steps or system behavior; it does not reproduce reported numerical results."
          image_fit: "contain"
          abstract_links: [{"text": "Paper", "url": "https://arxiv.org/abs/2609.33630"}, {"text": "Code", "url": "https://github.com/optiXlab1/lapanda"}]
          abstract_scope: "Illustrative graphical abstract: motion explains the method and does not reproduce measured results or benchmark timing."
          abstract_animation: "Symbolic forward solution and adjoint/operator evaluation, without an invented optimizer convergence trajectory."
          abstract_sources: [{"url": "https://arxiv.org/html/2609.33630v1", "locator": "Section 4.1, Assumption 1 and Theorem 1; Section 4.2 sensitivity alignment; Section 4.1, Eq. (4), P-sub, Algorithm 1; Theorem 2, Eq. (14); Appendix B.6"}, {"url": "https://github.com/optiXlab1/lapanda/blob/main/alm/alm.c", "locator": "README.md project summary; alm/alm.c, alm_solve_internal and Hessian/vector-product callbacks"}]
          summary: "A matrix-free augmented-Lagrangian solver enables efficient forward optimization and differentiation through nonconvex problems with general constraints."
          authors: "Yuankun Chen, Zifei Nie, Kangyu Lin, Ján Drgoňa, Liang Wu"
          links:
