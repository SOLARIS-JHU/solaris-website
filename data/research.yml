          abstract_id: "paper-27"
          abstract_order: 27
          abstract_summary: "Deterministic physics-informed neural networks do not directly express uncertainty caused by limited knowledge. E-PINNs adds an epinet to a pretrained, frozen PINN, using an epistemic index and a frozen prior component to generate prediction samples. This modular augmentation estimates epistemic uncertainty around the base solution while retaining its learned physics-informed prediction structure."
