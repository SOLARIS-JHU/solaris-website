        - title: "Topological Feasibility Guarantees for Differentiable Predictive Control"
          abstract_id: "arxiv-2608.10332"
          abstract_order: 6
          abstract_summary: "Offline policy training must connect feasibility at sampled trajectories to feasibility beyond those samples. This work combines barrier-based differentiable predictive control with warm-started homotopy training and a topological analysis of safe trajectory neighborhoods. Strict safety margins, continuity, and sufficient finite coverage support conditional feasibility guarantees for learned policies under the stated regularity and compactness assumptions."
          image: "images/papers/v6/arxiv-2608.10332.png"
          image_animated: "images/papers/v6/arxiv-2608.10332.svg"
          image_static: "images/papers/v6/arxiv-2608.10332-static.svg"
          image_alt: "Train with a control-barrier proxy and warm-started homotopy; use strict safety margins and continuity to extend sample feasibility to neighborhoods and a finite cover. Connect offline training samples to topological coverage of reachable safe trajectories. Motion illustrates algorithm steps or system behavior; it does not reproduce reported numerical results."
          image_fit: "contain"
          abstract_links: [{"text": "Paper", "url": "https://arxiv.org/abs/2608.10332"}]
          abstract_scope: "Illustrative graphical abstract: motion explains the method and does not reproduce measured results or benchmark timing."
          abstract_animation: "The upper rollout improves toward a fixed illustrative target. Small lower probes remain within fixed neighborhoods around samples; they are local perturbations, not closed-loop trajectories or evidence that arbitrary samples certify a region."
          abstract_sources: [{"url": "https://arxiv.org/html/2608.10332v1", "locator": "Section 3 Assumptions 3.1-3.4, Proposition 3.8, Theorem 3.10; Section 4; Eq. 6; Proposition 3.8; Theorem 3.10; Lemma 3.12; CBF-proxy training"}]
          summary: "Topological analysis and barrier-based offline training establish deterministic feasibility guarantees for differentiable predictive control from finitely many training samples."
          authors: "Guangyu Wu, Ján Drgoňa"
          links:
            - text: "Preprint"
              url: "https://arxiv.org/abs/2608.10332"

        - title: "Accelerating and Scaling MPC-Guided Reinforcement Learning for Humanoid Locomotion and Manipulation"
          abstract_id: "arxiv-2606.05687"
          abstract_order: 7
          abstract_summary: "Predictive control can provide useful structure for humanoid reinforcement learning, but solving many control problems during training is computationally demanding. A batched GPU centroidal MPC solver supplies predictive landmarks that shape training rewards across simulated environments. This training-time guidance supports learning whole-body locomotion and manipulation policies while parallelizing computation across environments and prediction horizons."
          image: "images/papers/v6/arxiv-2606.05687.png"
          image_animated: "images/papers/v6/arxiv-2606.05687.svg"
          image_static: "images/papers/v6/arxiv-2606.05687-static.svg"
          image_alt: "A batched GPU centroidal MPC solver supplies predictive landmarks for training rewards. RL learns whole-body behavior from this guidance. Parallel MPC computation across horizons and environments enables training-time model-based guidance. Motion illustrates algorithm steps or system behavior; it does not reproduce reported numerical results."
          image_fit: "contain"
          abstract_links: [{"text": "Paper", "url": "https://arxiv.org/abs/2606.05687"}, {"text": "Code", "url": "https://github.com/junhengl/mpc-rl"}, {"text": "Website", "url": "https://caltech-amber.github.io/mpc-guided-rl/"}]
          abstract_scope: "Illustrative graphical abstract: motion explains the method and does not reproduce measured results or benchmark timing."
          abstract_animation: "Walking, carrying, and cart pushing are representative task illustrations, supported by the paper's application discussion. The 4.5-second display cycle is an animation choice, not measured hardware timing. The deployment row shows fixed task-specific policies, without runtime MPC or a claim that one universal policy performs every task. Representative planar articulated kinematics, not measured hardware trajectories or a dynamic simulation. The walking variants advance 104 canonical units in four alternating steps. Stance feet remain planted at each sampled pose; raised swing feet use smooth position and clearance curves. The same rigid object trajectories define both hand targets, and cart wheel angle equals translation divided by radius. All rigid parts share the same cycle: 0–92% advance, 92–95% hold, 95–99% fade, 99.2–100% hidden reset. Reach/lift/balance remain reusable examples and are not added to paper 7's reported experiments."
          abstract_sources: [{"url": "https://arxiv.org/html/2606.05687v1", "locator": "Sections II-IV, especially II-C and IV-A; Figure 1 and Sections V-C/V-D for walking, payload carrying, and cart pushing; Eqs. 11â€“17; Sections II-C and IV"}, {"url": "https://caltech-amber.github.io/mpc-guided-rl/", "locator": "Abstract; System Architecture"}, {"url": "https://github.com/junhengl/mpc-rl/blob/main/README.md", "locator": "Overview; MPC and solvers"}, {"url": "https://github.com/junhengl/mpc-rl/blob/main/src/themis_training/mpc_grf_mdp.py", "locator": "LocoMPCCommand; MpcAngMomTracking; mpc_com_tracking"}, {"url": "https://www.unitree.com/h1/", "locator": "Manufacturer anatomy reference: compact perception hardware, articulated upper/lower links and industrial joint motors. Used for generic mechanical form only; the drawing is not an exact Unitree model."}]
          summary: "A batched GPU MPC solver provides efficient training-time guidance for reinforcement learning of humanoid locomotion and manipulation skills."
          authors: "Junheng Li, Liang Wu, Sergio A. Esteban, Lizhi Yang, Ján Drgoňa, Aaron D. Ames"
          links:
            - text: "Preprint"
              url: "https://arxiv.org/abs/2606.05687"
