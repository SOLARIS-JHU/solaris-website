        - title: "Safe Receding Horizon Mixed-Integer Differentiable Predictive Control for Degradation-Aware Battery Dispatch"
          abstract_id: "arxiv-2609.28698"
          abstract_order: 38
          abstract_summary: "Battery dispatch must adapt to updated state information while accounting for degradation and operating limits. This receding-horizon controller combines a rainflow-trained neural mode/action policy with a one-step quadratic-program safety filter. Replanning uses current charge and forecast windows, while mode-conditioned filtering supports recursive feasibility under the stated nominal dynamics, feasible initialization, and nonempty convex constraint sets."
          image: "images/papers/v6/arxiv-2609.28698.png"
          image_animated: "images/papers/v6/arxiv-2609.28698.svg"
          image_static: "images/papers/v6/arxiv-2609.28698-static.svg"
          image_alt: "A neural mode/action policy replans each step; a one-step QP filter enforces nominal state and power bounds. Combines rainflow-trained dispatch with feedback and recursive nominal feasibility. Motion illustrates algorithm steps or system behavior; it does not reproduce reported numerical results."
          image_fit: "contain"
          abstract_links: [{"text": "Paper", "url": "https://arxiv.org/abs/2609.28698"}]
          abstract_scope: "Illustrative graphical abstract: motion explains the method and does not reproduce measured results or benchmark timing."
          abstract_animation: "An infeasible proposed power is projected to the fixed feasible interval. Its squared distance from the proposal increases until feasibility is reached; the animation explicitly does not claim descent starting at the infeasible unconstrained minimizer."
          abstract_sources: [{"url": "https://arxiv.org/html/2609.28698v1", "locator": "Sections III-E and IV-B; Theorems 1–2; Remark 2; Eqs. (12)–(20); Algorithms 1–2; Theorems 1–2; Remark 2"}]
          venue: "IEEE CDC 2026"
          summary: "A receding-horizon neural battery-dispatch controller with differentiable degradation physics and a safety filter that guarantees recursive feasibility."
          authors: "Eshagh Safarzadeh Ravajiri, Ján Drgoňa, Benjamin F. Hobbs"
          links:
            - text: "Preprint"
              url: "https://arxiv.org/abs/2609.28698"

        - title: "Data Center Chiller Plant Optimization via Mixed-Integer Nonlinear Differentiable Predictive Control"
          abstract_id: "arxiv-2603.28323"
          abstract_order: 39
          abstract_summary: "Data-center chiller plants combine discrete equipment staging with nonlinear continuous operating decisions. This mixed-integer differentiable predictive-control framework trains separate policy heads for chiller activation, flow rates, and evaporation temperatures through thermal dynamics. Energy, cooling-tracking, and switching objectives shape the policy, while differentiable binary rounding and binary-variance regularization promote decisive equipment staging in simulated operation."
          image: "images/papers/v6/arxiv-2603.28323.png"
          image_animated: "images/papers/v6/arxiv-2603.28323.svg"
          image_static: "images/papers/v6/arxiv-2603.28323-static.svg"
          image_alt: "Separate policy heads and differentiable binary rounding train through thermal dynamics with energy, tracking and switching objectives. Binary-variance regularization promotes decisive staging. Motion illustrates algorithm steps or system behavior; it does not reproduce reported numerical results."
          image_fit: "contain"
          abstract_links: [{"text": "Paper", "url": "https://arxiv.org/abs/2603.28323"}, {"text": "Code", "url": "https://github.com/pnnl/MI-DPC"}, {"text": "Website", "url": "https://xboldocky.github.io/chiller-plant-MIDPC/"}]
          abstract_scope: "Illustrative graphical abstract: motion explains the method and does not reproduce measured results or benchmark timing."
