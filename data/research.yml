        - title: "Koopman-BoxQP: Solving Large-Scale NMPC at kHz Rates"
          abstract_id: "arxiv-2602.18331"
          abstract_order: 19
          abstract_summary: "Large lifted models can make nonlinear predictive control expensive to solve online. Koopman-BoxQP eliminates lifted observables and penalizes prediction residuals to obtain a box-constrained quadratic program over the control formulation. A warm-started Mehrotra interior-point method exploits the resulting structure and reduced Newton systems to support fast repeated optimization with approximate Koopman dynamics."
