        - title: "CINOC: Cardinality-Invariant Neural Operator Policies for Scalable PDE Control"
          abstract_id: "paper-11"
          abstract_order: 11
          abstract_summary: "PDE control with multiple actuators must accommodate changes in the number and locations of agents. CINOC uses a shared neural-operator policy that each agent queries from local field observations and coordinates, producing actuation intensities and, for mobile agents, velocities. Training through a differentiable PDE solver enables demonstrated transfer across agent populations without retraining the shared policy."
