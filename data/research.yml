          image_animated: "images/papers/v6/arxiv-2602.15596.svg"
          image_static: "images/papers/v6/arxiv-2602.15596-static.svg"
          image_alt: "Use dynamics relaxation to obtain a structured BoxQP; apply a certified predictor-corrector IPM with reduced Newton systems. Combines a finite iteration budget with control-specific linear algebra. Motion illustrates algorithm steps or system behavior; it does not reproduce reported numerical results."
