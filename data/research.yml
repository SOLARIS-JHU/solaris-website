        - title: "DR-MPC: Fast and Feasible Dynamics-Relaxed Model-Predictive Control for Legged Locomotion"
          abstract_id: "arxiv-2609.20035"
          abstract_order: 18
          abstract_summary: "Legged locomotion requires rapid replanning of contact forces under changing stance and swing phases. DR-MPC relaxes dynamics and affine friction residuals into penalties, removes swing-leg forces, and groups stance controls to obtain a reduced box-constrained quadratic program. The contact-aware formulation simplifies the factorized control system and provides feasibility for the relaxed problem with nonempty input boxes."
          image: "images/papers/v6/arxiv-2609.20035.png"
          image_animated: "images/papers/v6/arxiv-2609.20035.svg"
          image_static: "images/papers/v6/arxiv-2609.20035-static.svg"
          image_alt: "Relax dynamics and affine friction residuals into penalties; eliminate swing forces and block stance controls; solve a reduced BoxQP. Contact-aware parameterization reduces the solver's factorized control system. Motion illustrates algorithm steps or system behavior; it does not reproduce reported numerical results."
          image_fit: "contain"
          abstract_links: [{"text": "Paper", "url": "https://arxiv.org/abs/2609.20035"}]
          abstract_scope: "Illustrative graphical abstract: motion explains the method and does not reproduce measured results or benchmark timing."
