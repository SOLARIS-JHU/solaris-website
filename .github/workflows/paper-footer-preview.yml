name: Preview paper footer layout
on:
  push:
    branches: ["codex/paper-footer-layout-20261111"]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.155.2'
          extended: true
      - run: hugo --minify --baseURL http://127.0.0.1:8765/
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Render responsive previews
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.56.1
          npx playwright install chromium --with-deps
          python3 -m http.server 8765 --directory public > /tmp/papers-preview-http.log 2>&1 &
          node <<'JS'
          const { chromium } = require('playwright');
          const fs = require('node:fs');
          (async () => {
            const browser = await chromium.launch();
            const reports = [];
            for (const width of [1440,1280,1024,900,768,390,320]) {
              const page = await browser.newPage({ viewport: {width,height:1100}, reducedMotion:'reduce' });
              await page.goto('http://127.0.0.1:8765/papers.html',{waitUntil:'networkidle'});
              await page.evaluate(()=>document.fonts.ready);
              const report = await page.evaluate(() => {
                const rect = e => { const b=e.getBoundingClientRect(); return {left:b.left,right:b.right,top:b.top,bottom:b.bottom,width:b.width,height:b.height}; };
                return {width:innerWidth,documentWidth:document.documentElement.scrollWidth,cards:[...document.querySelectorAll('[data-spg-card]')].map(card=>{
                  const footer=card.querySelector('.spg-card-footer'),links=[...footer.querySelectorAll('a')],year=footer.querySelector('.spg-paper-year');
                  const boxes=[...links,year].map(rect),centers=boxes.map(b=>(b.top+b.bottom)/2);
                  return {id:card.dataset.paperId,card:rect(card),footer:rect(footer),boxes,centerSpread:Math.max(...centers)-Math.min(...centers),linkFont:getComputedStyle(links[0]).fontSize,labels:links.map(a=>a.textContent.trim())};
                })};
              });
              reports.push(report);
              if ([1440,390,320].includes(width)) {
                const card=page.locator('[data-paper-id="arxiv-2512.20880"]');
                const data=await card.screenshot({type:'jpeg',quality:75});
                const b64=data.toString('base64');
                for(let i=0;i<b64.length;i+=4096)console.log('PAPERS_PREVIEW '+width+' '+(i/4096)+' '+b64.slice(i,i+4096));
              }
              await page.close();
            }
            console.log('PAPERS_GEOMETRY '+JSON.stringify(reports));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
