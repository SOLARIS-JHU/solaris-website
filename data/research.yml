          image_alt: "Augment the system with its barrier value; learn a lifted predictor; impose linear relaxed barrier constraints in a QP. Lift dynamics and barrier together to obtain a tractable predictive constraint. Motion illustrates algorithm steps or system behavior; it does not reproduce reported numerical results."
