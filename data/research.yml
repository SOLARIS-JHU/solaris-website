          image_animated: "images/papers/v6/arxiv-2604.02069.svg"
          image_static: "images/papers/v6/arxiv-2604.02069-static.svg"
          image_alt: "Split coefficients into nonnegative variables, form a smooth QP, and construct a Newton-based continuous-time flow of its KKT residuals. The continuous-time settling bound is set through the flow gain. Motion illustrates algorithm steps or system behavior; it does not reproduce reported numerical results."
          image_fit: "contain"
          abstract_links: [{"text": "Paper", "url": "https://ieeexplore.ieee.org/document/11523518"}, {"text": "Preprint", "url": "https://arxiv.org/abs/2604.02069"}]
          abstract_scope: "Illustrative graphical abstract: motion explains the method and does not reproduce measured results or benchmark timing."
          abstract_animation: "The x_minus=0 nonnegative slice has its own valid projected descent to the slice optimum; it is not claimed to be a slice of the full positive primal-dual Newton trajectory. Those original Newton trajectories retain their mathematical time sampling."
          abstract_sources: [{"url": "https://arxiv.org/html/2604.02069v1", "locator": "Section III-A; Section III-B, Propositions III.4 and III.6, Theorem III.7; Section III-C; Eqs. (12–15), Proposition III.2; Eqs. (17–19); Eq. (20), Propositions III.4 and III.6, Theorem III.7"}]
          venue: "IEEE L-CSS / CDC 2026"
