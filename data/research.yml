        - title: "Polynomial Parametric Koopman Operators for Stochastic MPC"
          abstract_id: "arxiv-2604.00935"
          abstract_order: 22
          abstract_summary: "Uncertain fixed parameters complicate prediction and constraint handling in nonlinear MPC. Polynomial Parametric Koopman Operators represent the parameter dependence of lifted dynamics through polynomial-chaos coefficients learned from data. Condensing expected costs and moment constraints produces a deterministic control problem whose online variables scale with the input dimension and horizon rather than the lifted-state or polynomial-basis sizes."
          image: "images/papers/v6/arxiv-2604.00935.png"
          image_animated: "images/papers/v6/arxiv-2604.00935.svg"
          image_static: "images/papers/v6/arxiv-2604.00935-static.svg"
          image_alt: "Represent Koopman matrices with polynomial-chaos coefficients, learn them from data, and condense expected costs and moment constraints. Online variables scale with input dimension and horizon rather than lifted-state or polynomial-basis size. Motion illustrates algorithm steps or system behavior; it does not reproduce reported numerical results."
          image_fit: "contain"
          abstract_links: [{"text": "Paper", "url": "https://arxiv.org/abs/2604.00935"}]
          abstract_scope: "Illustrative graphical abstract: motion explains the method and does not reproduce measured results or benchmark timing."
