        - title: "Least-Squares Multi-Step Koopman Operator Learning for Model Predictive Control"
          abstract_id: "arxiv-2601.11901"
          abstract_order: 25
          abstract_summary: "Predictive control needs accurate models over an entire horizon rather than only one step. This method learns the condensed multi-step Koopman mapping directly through convex least squares, with independent subproblems across horizon positions and state coordinates. Optional dictionary pruning reduces the representation, avoiding repeated application of a fitted one-step operator when constructing future predictions."
