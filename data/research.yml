        - title: "Learning to Solve Constrained Bilevel Control Co-Design Problems"
          abstract_id: "arxiv-2507.09050"
          abstract_order: 3
          abstract_summary: "Control co-design couples physical design choices to the behavior of an optimal controller. This self-supervised framework predicts design variables, differentiates through the lower-level control problem, and corrects violations of constraints coupling the two levels. Upper-level projection and gradient-based correction incorporate design feasibility into learning while retaining the controller's role in evaluating each candidate design."
          image: "images/papers/v6/arxiv-2507.09050.png"
          image_animated: "images/papers/v6/arxiv-2507.09050.svg"
          image_static: "images/papers/v6/arxiv-2507.09050-static.svg"
          image_alt: "Predict an upper-level design, solve the lower-level problem differentiably, and apply gradient-based corrections to coupling violations with upper-level projection. Learn design predictions while accounting explicitly for control optimality and coupling constraints. Motion illustrates algorithm steps or system behavior; it does not reproduce reported numerical results."
          image_fit: "contain"
          abstract_links: [{"text": "Paper", "url": "https://arxiv.org/abs/2507.09050"}, {"text": "Code", "url": "https://github.com/anon-research-coding/Control-Design-Learning"}, {"text": "Website", "url": "https://solaris-jhu.github.io/Learning-Control-Co-Design-page/"}]
          abstract_scope: "Illustrative graphical abstract: motion explains the method and does not reproduce measured results or benchmark timing."
          abstract_animation: "The design candidate undergoes trial updates and feasible-set projection, while the lower optimizer supplies a control response. A separate schematic objective marker approaches the quadratic minimum. The outer training gradient remains distinct from finite coupling corrections."
          abstract_sources: [{"url": "https://arxiv.org/html/2507.09050v2", "locator": "Section 3 conditions; Sections 4.1-4.3; Eqs. 3–9; Sections 4.1–4.2"}, {"url": "https://github.com/anon-research-coding/Control-Design-Learning/blob/main/README.md", "locator": "README"}, {"url": "https://github.com/anon-research-coding/Control-Design-Learning/blob/main/BQP/QP_correction.py", "locator": "x_correction"}]
          summary: "A self-supervised learning-to-optimize framework for constrained bilevel control co-design with enforced coupling constraints."
          authors: "James Kotary, Himanshu Sharma, Ethan King, Draguna Vrabie, Ferdinando Fioretto, Ján Drgoňa"
          links:
