        - title: "Stability Enhanced Gaussian Process Variational Autoencoders"
          abstract_id: "arxiv-2604.09331"
          abstract_order: 29
          abstract_summary: "Learning dynamics from video requires connecting high-dimensional observations to an interpretable state representation. This model combines a variational autoencoder with a Gaussian-process prior derived from linear dynamical systems. An unconstrained matrix parameterization restricts the learned latent dynamics to semi-contracting systems, supporting latent prediction and image reconstruction while incorporating stability structure into the learned representation."
          image: "images/papers/v6/arxiv-2604.09331.png"
          image_animated: "images/papers/v6/arxiv-2604.09331.svg"
          image_static: "images/papers/v6/arxiv-2604.09331-static.svg"
          image_alt: "A VAE encoder supplies latent observations to an LTI-derived Gaussian-process prior; a decoder reconstructs images. An unconstrained matrix parameterization restricts learned dynamics to semi-contracting systems. Motion illustrates algorithm steps or system behavior; it does not reproduce reported numerical results."
          image_fit: "contain"
          abstract_links: [{"text": "Paper", "url": "https://arxiv.org/abs/2604.09331"}, {"text": "Code", "url": "https://github.com/pnnl/COPIP"}]
          abstract_scope: "Illustrative graphical abstract: motion explains the method and does not reproduce measured results or benchmark timing."
          abstract_animation: "Video and latent particles trace explicitly damped rotational curves, not learned experimental trajectories. Each curve is a linear image of exp(-a t)(cos(omega t),sin(omega t)), hence compatible with a stable two-state LTI example. Moving particles advance and fade/reset instead of reversing the dynamics."
          abstract_sources: [{"url": "https://arxiv.org/html/2604.09331v2", "locator": "Sections III–V; Theorem 3; Fig. 1; Eq. (6), Theorem 1 Eqs. (7)–(9), Theorem 2 Eq. (10), Theorem 3 Eq. (12), Fig. 1"}, {"url": "https://github.com/pnnl/COPIP/blob/master/Code/SEGP/SEGP.py", "locator": "SEGP.__init__ and get_AP"}, {"url": "https://github.com/pnnl/COPIP/blob/master/README.md", "locator": "Overview"}]
