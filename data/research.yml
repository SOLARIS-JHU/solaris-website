          abstract_summary: "Real-time control requires box-constrained quadratic programs to be solved with predictable computational effort. This predictor-corrector interior-point method starts from strictly feasible variables and alternates adaptive predictor steps with full corrector steps. For convex BoxQP problems, the analysis supplies a data-independent iteration bound to reach a specified duality-gap tolerance under the stated initialization."
