          abstract_summary: "Many physical systems combine evolving differential states with algebraic relationships. This work learns neural differential-algebraic models using an operator-splitting timestepper that first updates algebraic variables and then integrates the differential states. The sequential architecture incorporates partially known structure for index-1 semi-explicit systems, with learned algebraic updates approximating the consistency relationships required by the model."
