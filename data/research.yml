        - title: "Learning to Control PDEs with Differentiable Predictive Control and Time-Integrated Neural Operators"
          abstract_id: "arxiv-2511.08992"
          abstract_order: 9
          abstract_summary: "Controlling spatially distributed systems requires models that support prediction and efficient policy optimization. This framework learns a temporal-derivative operator with a Time-Integrated DeepONet, integrates it numerically, and uses the frozen surrogate for differentiable closed-loop rollouts. Control losses are backpropagated through those rollouts to train explicit neural policies for PDE actuation and field tracking."
          image: "images/papers/v6/arxiv-2511.08992.png"
          image_animated: "images/papers/v6/arxiv-2511.08992.svg"
          image_static: "images/papers/v6/arxiv-2511.08992-static.svg"
          image_alt: "Learn a temporal-derivative operator and integrate it numerically. Freeze this surrogate, then backpropagate control loss through closed-loop rollouts to train the policy. Time-integrated DeepONet supplies differentiable PDE dynamics for offline policy optimization. Motion illustrates algorithm steps or system behavior; it does not reproduce reported numerical results."
          image_fit: "contain"
          abstract_links: [{"text": "Paper", "url": "https://arxiv.org/abs/2511.08992"}, {"text": "Code", "url": "https://github.com/Centrum-IntelliPhysics/PDEControl_DPC"}, {"text": "Website", "url": "https://centrum-intelliphysics.github.io/PDEControl_DPC_website/"}]
          abstract_scope: "Illustrative graphical abstract: motion explains the method and does not reproduce measured results or benchmark timing."
          abstract_animation: "Spatial fields illustrate a scalar PDE state. The frozen learned derivative operator and explicit integration remain distinct. The field is an illustrative analytic advection-diffusion solution, not a reported controlled PDE result."
          abstract_sources: [{"url": "https://arxiv.org/html/2511.08992v3", "locator": "Sections III-A, III-B; training procedure; Eqs. 3â€“6; Figure 1; Section III"}, {"url": "https://github.com/Centrum-IntelliPhysics/PDEControl_DPC/blob/main/README.md", "locator": "Methodology; Experiments"}, {"url": "https://github.com/Centrum-IntelliPhysics/PDEControl_DPC/blob/main/HE_TT/train_dpc.py", "locator": "create_dpc_loss_fn; train_step"}, {"url": "https://centrum-intelliphysics.github.io/PDEControl_DPC_website/", "locator": "Project page"}]
