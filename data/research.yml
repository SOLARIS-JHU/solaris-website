              url: "https://github.com/junhengl/mpc-rl"
            - text: "Website"
              url: "https://caltech-amber.github.io/mpc-guided-rl/"

        - title: "Zero-Shot Transferable Solution Method for Parametric Optimal Control Problems"
          abstract_id: "arxiv-2509.18404"
          abstract_order: 8
          abstract_summary: "Changing an optimal-control objective often requires adapting an existing policy. This method learns reusable neural policy basis functions offline from expert solutions and combines them with task-specific coefficients. New coefficients are estimated from state-action examples by least squares, or predicted by a separately trained operator, enabling transfer within the learned task family without retraining the policy bases."
          image: "images/papers/v6/arxiv-2509.18404.png"
          image_animated: "images/papers/v6/arxiv-2509.18404.svg"
          image_static: "images/papers/v6/arxiv-2509.18404-static.svg"
          image_alt: "Learn reusable policy basis functions offline by imitation. At deployment, estimate coefficients using least squares or an optional learned parameter-to-coefficient operator. Transfer across objectives by changing coefficients while keeping policy bases fixed. Motion illustrates algorithm steps or system behavior; it does not reproduce reported numerical results."
          image_fit: "contain"
          abstract_links: [{"text": "Paper", "url": "https://arxiv.org/abs/2509.18404"}, {"text": "Code", "url": "https://github.com/XJ-LI/FE_OC"}, {"text": "Website", "url": "https://solaris-jhu.github.io/FE-OC-website/"}]
          abstract_scope: "Illustrative graphical abstract: motion explains the method and does not reproduce measured results or benchmark timing."
          abstract_animation: "Markers evaluate fixed basis curves and illustrative policy trajectories forward. They do not retrain neural basis functions online."
          abstract_sources: [{"url": "https://arxiv.org/html/2509.18404v2", "locator": "Section III; Algorithms 1-2; Online Phase; Theorem 2; Eqs. 5â€“8; Offline and Online phases"}, {"url": "https://github.com/XJ-LI/FE_OC/blob/main/README.md", "locator": "Commands for experiments"}, {"url": "https://github.com/XJ-LI/FE_OC/blob/main/2D_toy_control/train_ctrhill.py", "locator": "FunctionEncoder construction; model.train_model"}]
          venue: "American Control Conference 2026"
          summary: "Function-encoder policies learn reusable neural basis functions offline and adapt to new optimal-control objectives through lightweight coefficient estimation."
          authors: "Xingjian Li, Kelvin Kan, Deepanshu Verma, Krishna Kumar, Stanley Osher, Ján Drgoňa"
          links:
            - text: "Preprint"
              url: "https://arxiv.org/abs/2509.18404"
