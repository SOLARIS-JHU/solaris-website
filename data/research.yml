        - title: "Time-Certified and Efficient NMPC via Koopman Operator"
          abstract_id: "arxiv-2602.15596"
          abstract_order: 23
          abstract_summary: "Real-time nonlinear MPC benefits from a predictable bound on optimization effort. This framework combines learned Koopman dynamics and dynamics relaxation to form a structured box-constrained quadratic program. A certified predictor-corrector interior-point method exploits reduced Newton systems and provides an iteration budget for reaching a specified tolerance on the reformulated convex problem."
