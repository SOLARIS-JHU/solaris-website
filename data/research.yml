          image_animated: "images/papers/v6/arxiv-2601.11901.svg"
          image_static: "images/papers/v6/arxiv-2601.11901-static.svg"
          image_alt: "Fit the condensed multi-step mapping by convex least squares, decomposed by horizon and state coordinate; optionally prune dictionary entries. Bypasses repeated application of a fitted one-step operator. Motion illustrates algorithm steps or system behavior; it does not reproduce reported numerical results."
