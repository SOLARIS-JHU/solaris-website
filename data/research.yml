          image_animated: "images/papers/v6/arxiv-2511.05757.svg"
          image_static: "images/papers/v6/arxiv-2511.05757-static.svg"
          image_alt: "Learn neural-ODE basis functions and train a coefficient-conditioned DPC policy offline. Online data estimate dynamics coefficients while both neural models remain fixed. Adapt dynamics representation without retraining the predictive control policy. Motion illustrates algorithm steps or system behavior; it does not reproduce reported numerical results."
