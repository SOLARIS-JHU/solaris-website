- area: "Learning to Optimize"
  description: "Learning-based methods that accelerate constrained, mixed-integer, and decision-focused optimization while preserving feasibility and physical requirements."
  years:
    - year: 2025
      papers:
        - title: "Learning to Solve Constrained Bilevel Control Co-Design Problems"
          summary: "A self-supervised learning-to-optimize framework for constrained bilevel control co-design with enforced coupling constraints."
          lead: "James Kotary"
          links:
            - text: "Preprint"
              url: "https://arxiv.org/abs/2507.09050"
            - text: "GitHub"
              url: "https://github.com/anon-research-coding/Control-Design-Learning"

        - title: "Accelerating Underground Pumped Hydro Energy Storage Scheduling with Decision-Focused Learning"
          summary: "A decision-focused learning framework that uses neural networks to guide recursive linearization for energy-storage scheduling."
          lead: "Honghui Zheng"
          links:
            - text: "Preprint"
              url: "https://arxiv.org/abs/2512.20880"
            - text: "GitHub"
              url: "https://github.com/SOLARIS-JHU/DFL-UPHES"

    - year: 2024
      papers:
        - title: "Learning to Optimize for Mixed-Integer Nonlinear Programming with Feasibility Guarantees"
          summary: "A learning-to-optimize framework for parametric MINLP that combines adaptive integer correction with projections to guarantee feasibility."
          lead: "Bo Tang"
          links:
            - text: "Preprint"
              url: "https://arxiv.org/abs/2410.11061"
            - text: "GitHub"
              url: "https://github.com/pnnl/L2O-MINLP"

- area: "Learning to Control"
  description: "Data-driven control policies for constrained nonlinear and distributed systems, trained through differentiable predictive control and operator learning."
  years:
    - year: 2026
      papers:
        - title: "CINOC: Cardinality-Invariant Neural Operator Policies for Scalable PDE Control"
          summary: "Decentralized neural-operator control policies for PDE systems that generalize zero-shot across different swarm cardinalities."
          lead: "Pietro Zanotta"
          links:
            - text: "Preprint"
              url: "https://arxiv.org/abs/2605.25867"
            - text: "GitHub"
              url: "https://github.com/SOLARIS-JHU/CINOC"

    - year: 2025
      papers:
        - title: "Learning to Solve Parametric Mixed-Integer Optimal Control Problems via DPC"
          summary: "Near-optimal control for input- and state-constrained parametric mixed-integer problems using differentiable predictive control."
          lead: "Ján Boldocký"
          links:
            - text: "Preprint"
              url: "https://arxiv.org/abs/2506.19646"

        - title: "Zero-Shot Function Encoder-Based Differentiable Predictive Control"
          summary: "Function Encoder-based neural ODEs integrated with differentiable predictive control for zero-shot control of nonlinear systems."
          lead: "Hassan Iqbal"
          links:
            - text: "Preprint"
              url: "https://arxiv.org/abs/2511.05757"

        - title: "Learning to Control PDEs with Differentiable Predictive Control and Time-Integrated Neural Operators"
          summary: "An end-to-end framework combining Time-Integrated DeepONets with offline, self-supervised optimization of PDE control policies."
          lead: "Dibakar Roy Sarkar"
          links:
            - text: "Preprint"
              url: "https://arxiv.org/abs/2511.08992"
            - text: "GitHub"
              url: "https://github.com/Centrum-IntelliPhysics/PDEControl_DPC"

- area: "Optimization and Model Predictive Control"
  description: "Fast, time-certified, and parallel algorithms for real-time optimization and predictive control."
  years:
    - year: 2026
      papers:
        - title: "Fixed-Time-Stable ODE Representation of Lasso"
          summary: "A smooth, projection-free ODE formulation of Lasso with a prescribed convergence time that is independent of the problem data."
          lead: "Liang Wu"
          links:
            - text: "Paper"
              url: "https://ieeexplore.ieee.org/document/11523518"

        - title: "πMPC: A Parallel-in-Horizon and Construction-Free NMPC Solver"
          summary: "A variable-splitting nonlinear MPC solver designed for efficient parallel execution directly on system matrices."
          lead: "Liang Wu"
          links:
            - text: "Preprint"
              url: "https://arxiv.org/abs/2601.14414"
            - text: "GitHub"
              url: "https://github.com/SOLARIS-JHU/PiMPC.jl"

        - title: "Least-Squares Multi-Step Koopman Operator Learning for Model Predictive Control"
          summary: "A convex multi-step Koopman framework for long-horizon dynamics learning that avoids compounding single-step prediction errors."
          lead: "Liang Wu"
          links:
            - text: "Preprint"
              url: "https://arxiv.org/abs/2601.11901"
            - text: "GitHub"
              url: "https://github.com/SOLARIS-JHU/Multi-step-Koopman"

    - year: 2025
      papers:
        - title: "A Time-Certified Predictor-Corrector IPM Algorithm for Box-QP"
          summary: "A predictor-corrector interior-point method with deterministic execution-time and iteration-complexity guarantees for real-time MPC."
          lead: "Liang Wu"
          links:
            - text: "Paper"
              url: "https://ieeexplore.ieee.org/abstract/document/11313851"
            - text: "GitHub"
              url: "https://github.com/liangwu2019/PC_BoxQP"

- area: "Scientific Machine Learning and System Identification"
  description: "Physics-informed, differentiable, and structure-aware models for learning reliable representations of complex dynamical systems."
  years:
    - year: 2026
      papers:
        - title: "∂CBDs: Differentiable Causal Block Diagrams"
          summary: "A framework that combines causal block diagrams, differentiable learning, and contract-based verification."
          lead: "Thomas Beckers"
          links:
            - text: "Preprint"
              url: "https://www.arxiv.org/abs/2602.07581"

    - year: 2025
      papers:
        - title: "Safe Physics-Informed Machine Learning for Dynamics and Control"
          summary: "A tutorial overview of physics-informed machine learning methods for safe modeling and control of dynamical systems."
          lead: "Ján Drgoňa"
          links:
            - text: "Paper"
              url: "https://ieeexplore.ieee.org/abstract/document/11107836"

        - title: "Learning Neural Differential Algebraic Equations via Operator Splitting"
          summary: "An operator-splitting integration scheme for learning neural differential-algebraic equation models from data."
          lead: "James Koch"
          links:
            - text: "Paper"
              url: "https://ieeexplore.ieee.org/abstract/document/11312239"
            - text: "GitHub"
              url: "https://github.com/pnnl/NeuralDAEs"
