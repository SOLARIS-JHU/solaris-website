          image_animated: "images/papers/v6/cinoc-cardinality-invariant-control.svg"
          image_static: "images/papers/v6/cinoc-cardinality-invariant-control-static.svg"
          image_alt: "Agents query a shared neural operator; a differentiable PDE solver couples their actions through the environment during training. Transfer a shared policy to different population sizes without retraining. Motion illustrates algorithm steps or system behavior; it does not reproduce reported numerical results."
