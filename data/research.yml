        - title: "Homotopy-Guided Self-Supervised Learning of Parametric Solutions for AC Optimal Power Flow"
          abstract_id: "arxiv-2511.11677"
          abstract_order: 34
          abstract_summary: "AC optimal power flow couples nonconvex network equations with operating limits. This self-supervised learning method trains a neural solution map while a homotopy schedule gradually deforms relaxed objectives or constraints toward the original problem. The continuation strategy guides training without labeled optimal solutions and targets improved convergence and feasibility across parameterized grid operating conditions."
          image: "images/papers/v6/arxiv-2511.11677.png"
          image_animated: "images/papers/v6/arxiv-2511.11677.svg"
          image_static: "images/papers/v6/arxiv-2511.11677-static.svg"
          image_alt: "Train a neural solution map while gradually deforming relaxed objectives or constraints toward the original AC-OPF problem. A continuation schedule guides self-supervised learning. Motion illustrates algorithm steps or system behavior; it does not reproduce reported numerical results."
          image_fit: "contain"
          abstract_links: [{"text": "Paper", "url": "https://doi.org/10.1109/PESGM58988.2026.11693405"}, {"text": "Preprint", "url": "https://arxiv.org/abs/2511.11677"}]
          abstract_scope: "Illustrative graphical abstract: motion explains the method and does not reproduce measured results or benchmark timing."
          abstract_animation: "Each stage is a schematic quadratic objective 0.5(dx²+2dy²); errors shrink as dx_j=-42(0.72)^j, dy_j=35(0.44)^j, equivalent to gradient descent with step 0.28. The three minima shift with continuation. This is a mathematical teaching motif, not the nonconvex AC-OPF loss surface or paper solver iterates."
          abstract_sources: [{"url": "https://arxiv.org/html/2511.11677v1", "locator": "Sections IV-A–IV-D; Fig. 2; Eqs. 4–11; §IV-A parametric policy; Eqs. (6), (9), (10); Fig. 2"}]
          venue: "IEEE PES General Meeting 2026"
          summary: "Homotopy-guided self-supervised training gradually restores AC optimal power-flow constraints to improve convergence and feasibility without labeled optimal solutions."
          authors: "Shimiao Li, Aaron Tuor, Draguna Vrabie, Larry Pileggi, Ján Drgoňa"
          links:
            - text: "Paper"
              url: "https://doi.org/10.1109/PESGM58988.2026.11693405"
            - text: "Preprint"
              url: "https://arxiv.org/abs/2511.11677"

        - title: "Physics vs. Structure: A Systematic Benchmark of Learning Strategies for Multi-Zone Building Thermal Dynamics"
          abstract_id: "paper-35"
          abstract_order: 35
          abstract_summary: "Choosing a thermal model for multizone building control involves tradeoffs among predictive accuracy, physical consistency, and computational cost. This benchmark compares linear state-space, multilayer-perceptron, neural state-space, neural-ODE, and physically consistent neural models using building-emulator data. It examines how data availability and zone coupling affect the value of added physical structure and model complexity."
          image: "images/papers/v6/thermal-model-benchmark-117472.png"
          image_animated: "images/papers/v6/thermal-model-benchmark-117472.svg"
          image_static: "images/papers/v6/thermal-model-benchmark-117472-static.svg"
          image_alt: "Benchmark linear state-space, MLP, neural state-space, neural ODE and physically consistent neural models. Evaluates when extra structure or complexity helps a control-oriented thermal model. Motion illustrates algorithm steps or system behavior; it does not reproduce reported numerical results."
          image_fit: "contain"
          abstract_links: [{"text": "Paper", "url": "https://www.sciencedirect.com/science/article/pii/S0378778826005323"}]
          abstract_scope: "Illustrative graphical abstract: motion explains the method and does not reproduce measured results or benchmark timing. This overview was prepared from accessible abstract-level material and does not depict comparative results."
          abstract_animation: "Qualitative inter-zone exchange and a periodic common evaluation signal illustrate benchmark organization. No temperature evolution, solver speed, prediction ranking or model superiority is asserted."
          abstract_sources: [{"url": "https://www.sciencedirect.com/science/article/abs/pii/S0378778826005323", "locator": "Publisher abstract and indexed highlights; Publisher abstract and indexed highlights; full text unavailable"}]
          venue: "Energy and Buildings"
          summary: "A benchmark of five system-identification approaches examines how data availability, zone coupling, and physical structure affect building thermal-model accuracy and cost."
          authors: "Soumya Vasisht, Cary Faulkner, Elad Michael, Aaron Tuor, Ján Drgoňa, Draguna Vrabie"
          links:
            - text: "Journal"
              url: "https://www.sciencedirect.com/science/article/pii/S0378778826005323"

        - title: "Accelerating Underground Pumped Hydro Energy Storage Scheduling with Decision-Focused Learning"
          abstract_id: "arxiv-2512.20880"
          abstract_order: 36
          abstract_summary: "Day-ahead pumped-hydro scheduling must account for nonlinear hydraulic behavior while remaining practical to compute. This decision-focused framework predicts penalty weights for repeated local linearization and convex quadratic-program refinements, evaluated through nonlinear simulation. Learning the regularization from the downstream operating objective adapts the refinement strategy while retaining the discrete operating modes supplied by the initial schedule."
          image: "images/papers/v6/arxiv-2512.20880.png"
          image_animated: "images/papers/v6/arxiv-2512.20880.svg"
          image_static: "images/papers/v6/arxiv-2512.20880-static.svg"
          image_alt: "A neural predictor chooses penalty weights; repeated local linearization and convex QP solves refine the schedule, which nonlinear simulation scores. Learn regularization through the downstream operating objective. Motion illustrates algorithm steps or system behavior; it does not reproduce reported numerical results."
          image_fit: "contain"
          abstract_links: [{"text": "Paper", "url": "https://doi.org/10.1109/TSTE.2026.3722492"}, {"text": "Code", "url": "https://github.com/SOLARIS-JHU/DFL-UPHES"}, {"text": "Preprint", "url": "https://arxiv.org/abs/2512.20880"}, {"text": "Website", "url": "https://solaris-jhu.github.io/DFL-UPHES/"}]
          abstract_scope: "Illustrative graphical abstract: motion explains the method and does not reproduce measured results or benchmark timing."
          abstract_animation: "The polytope and quadratic are fixed. The highlighted contour is the actual level f(x_k); it shrinks until tangent to the active constraint at the constrained optimum. Display time is rescaled along the path, not a measured solver runtime."
          abstract_sources: [{"url": "https://arxiv.org/html/2512.20880v2", "locator": "Section IV; Fig. 3; Algorithm 1; Section V-E; Algorithm 1; Eqs. (12), (13), (17)–(19), (23); Fig. 3"}, {"url": "https://github.com/SOLARIS-JHU/DFL-UPHES/blob/main/DFL/core/pipeline.py", "locator": "RecursiveLinearizationPipeline.forward"}, {"url": "https://github.com/SOLARIS-JHU/DFL-UPHES/blob/main/README.md", "locator": "The DFL Framework; reproducibility note"}]
          venue: "IEEE Transactions on Sustainable Energy"
          summary: "A decision-focused learning framework that guides recursive linearization for fast, high-quality day-ahead scheduling of underground pumped hydro energy storage."
