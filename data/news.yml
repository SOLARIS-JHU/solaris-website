- date: "September 2026"
  title: "Eight SOLARIS Papers Accepted at CDC 2026"
  summary: "SOLARIS will have a strong presence at the 65th IEEE Conference on Decision and Control in Honolulu. Congratulations to Liang, Pietro, Honghui, and everyone across the lab and our collaborator network behind this outstanding collective achievement."
  type: "Paper"
  details_label: "View the eight-paper lineup"
  details:
    - title: "Learning to Control PDEs with Differentiable Predictive Control and Time-Integrated Neural Operators"
      authors: "Dibakar, Ján, and Somdatta"
      url: "https://arxiv.org/abs/2511.08992"
    - title: "SCORE: Statistical Certification of Regions of Attraction via Extreme Value Theory"
      authors: "Pietro, Panos, and Ján"
      url: "https://arxiv.org/abs/2603.29658"
    - title: "Fixed-time-stable ODE Representation of Lasso"
      authors: "Liang, Yunhong, Wallace, Efstathios, Richard, and Ján"
      url: "https://arxiv.org/abs/2604.02069"
      note: "Also accepted as an IEEE Control Systems Letters paper."
    - title: "Stability Enhanced Gaussian Process Variational Autoencoders"
      authors: "Carl, Jichen, Ethan, and Ján"
      url: "https://arxiv.org/abs/2604.09331"
    - title: "Mixed-Integer Nonlinear Differentiable Predictive Control for Underground Pumped Hydro Energy Storage Systems"
      authors: "Honghui, Ján, Yury, and Ján"
      url: "https://arxiv.org/abs/2609.17964"
    - title: "Safe Receding Horizon Mixed-Integer Differentiable Predictive Control for Degradation-Aware Battery Dispatch"
      authors: "Eshagh, Ján, and Ben"
      url: "https://arxiv.org/abs/2609.28698"
    - title: "Koopman Meets Discrete-Time Control Barrier Functions: A Linear Model Predictive Control Framework"
      authors: "Shuo, Liang, Dawei, Ján, and Calin"
      url: "https://arxiv.org/abs/2603.21070"
    - title: "Polynomial Parametric Koopman Operators for Stochastic MPC"
      authors: "Efstathios, Wallace, Liang, Ján, and Richard"
      url: "https://arxiv.org/abs/2604.00935"
  note: "We gratefully acknowledge support from the U.S. DOE Office of Science, ASCR programme, through the SciDAC Institute LEADS, and from the Ralph O’Connor Sustainable Energy Institute at Johns Hopkins University."
  links:
    - label: "LEADS"
      url: "https://www.pnnl.gov/projects/leads-institute"
    - label: "ROSEI"
      url: "https://energyinstitute.jhu.edu/"

