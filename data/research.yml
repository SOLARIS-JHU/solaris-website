          abstract_links: [{"text": "Paper", "url": "https://arxiv.org/abs/2601.11901"}, {"text": "Code", "url": "https://github.com/SOLARIS-JHU/Multi-step-Koopman"}]
          abstract_scope: "Illustrative graphical abstract: motion explains the method and does not reproduce measured results or benchmark timing."
          abstract_animation: "Independent regression work builds the direct multistep map; no recursive one-step rollout is introduced."
