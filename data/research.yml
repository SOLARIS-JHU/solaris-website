          abstract_links: [{"text": "Paper", "url": "https://proceedings.mlr.press/v306/zanotta26a.html"}, {"text": "Code", "url": "https://github.com/SOLARIS-JHU/CINOC"}, {"text": "Website", "url": "https://solaris-jhu.github.io/CINOC-website/"}]
