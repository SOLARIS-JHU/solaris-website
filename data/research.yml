        - title: "πMPC: A Parallel-in-Horizon and Construction-Free NMPC Solver"
          abstract_id: "arxiv-2601.14414"
          abstract_order: 24
          abstract_summary: "Long prediction horizons create substantial computational work in model predictive control. πMPC combines variable splitting with a velocity-based representation to derive closed-form ADMM updates that can run across time stages in parallel. Operating directly on system matrices avoids constructing a general MPC-to-QP formulation, with nonlinear MPC handled through the method's local modeling framework."
          image: "images/papers/v6/arxiv-2601.14414.png"
          image_animated: "images/papers/v6/arxiv-2601.14414.svg"
          image_static: "images/papers/v6/arxiv-2601.14414-static.svg"
