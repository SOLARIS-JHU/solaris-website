        - title: "End-to-End Battery Dispatch with Exact Rainflow Degradation via Mixed-Integer Differentiable Predictive Control"
          abstract_id: "arxiv-2609.12968"
          abstract_order: 33
          abstract_summary: "Battery arbitrage must balance operating revenue against degradation from charge-discharge cycles. This mixed-integer predictive-control policy learns operating modes and power schedules through exact forward rainflow cycle costs, using sparse and proxy gradients for training. Incorporating cycle-based degradation into end-to-end learning connects scheduling decisions to battery wear, alongside architectural constraints and optional feasibility projection."
          image: "images/papers/v6/arxiv-2609.12968.png"
          image_animated: "images/papers/v6/arxiv-2609.12968.svg"
          image_static: "images/papers/v6/arxiv-2609.12968-static.svg"
          image_alt: "A mixed-integer policy produces a trajectory; exact forward rainflow costs train it using mixed sparse and proxy gradients. Differentiable training through otherwise discrete cycle counting. Motion illustrates algorithm steps or system behavior; it does not reproduce reported numerical results."
          image_fit: "contain"
          abstract_links: [{"text": "Paper", "url": "https://doi.org/10.1109/TSG.2026.3737375"}, {"text": "Code", "url": "https://github.com/SOLARIS-JHU/Battery-MI-DPC"}, {"text": "Preprint", "url": "https://arxiv.org/abs/2609.12968"}]
          abstract_scope: "Illustrative graphical abstract: motion explains the method and does not reproduce measured results or benchmark timing."
          abstract_animation: "The moving marker scans a fixed synthetic SOC history. The two highlighted rainflow pairs satisfy the four-point inner-cycle rule; unclosed residual half-cycles are not falsely paired. Forecast and proxy-gradient waves are qualitative analytic examples, not numerical training results."
          abstract_sources: [{"url": "https://arxiv.org/html/2609.12968v1", "locator": "Sections III-B, III-C, III-E.2 and III-G; Eq. (2d); Eqs. (18), (25)–(29); §III-C.7 rainflow; Fig. 2"}, {"url": "https://github.com/SOLARIS-JHU/Battery-MI-DPC/blob/main/Battery-MI-DPC.ipynb", "locator": "RainflowFunction.forward/backward; L2O.forward; project_to_feasible"}]
          venue: "IEEE Transactions on Smart Grid"
          summary: "A differentiable rainflow layer trains mixed-integer battery-dispatch policies on exact cycle degradation, with a safety filter enforcing operating constraints."
          authors: "Eshagh Safarzadeh Ravajiri, Ján Drgoňa, Mahdi Mehrtash, Benjamin F. Hobbs"
