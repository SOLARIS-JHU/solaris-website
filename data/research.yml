        - title: "Accelerating Branch MPC with Two-Level Parallel Direct Solves on GPUs"
          abstract_id: "arxiv-2609.29977"
          abstract_order: 17
          abstract_summary: "Branch MPC creates large linear systems that couple a shared initial decision to independent future scenarios. This GPU direct solver reorganizes the system into scenario-tail factorizations and horizon-parallel triangular solves, with coupling handled through the root block. Exploiting both levels of structure enables concurrent work across scenarios and prediction steps for the required positive-definite systems."
          image: "images/papers/v6/arxiv-2609.29977.png"
          image_animated: "images/papers/v6/arxiv-2609.29977.svg"
          image_static: "images/papers/v6/arxiv-2609.29977-static.svg"
          image_alt: "Reorder blocks for concurrent scenario-tail Cholesky factorizations and horizon-parallel triangular solves, coupling tails through the root. Parallelism spans both scenarios and time steps. Motion illustrates algorithm steps or system behavior; it does not reproduce reported numerical results."
          image_fit: "contain"
          abstract_links: [{"text": "Paper", "url": "https://arxiv.org/abs/2609.29977"}]
          abstract_scope: "Illustrative graphical abstract: motion explains the method and does not reproduce measured results or benchmark timing."
          abstract_animation: "Parallel tail factorizations followed by root reduction; movement is calculation order, not measured timing."
          abstract_sources: [{"url": "https://arxiv.org/html/2609.29977v1", "locator": "Figure 1; Sections III-B and IV-A–IV-C; Algorithms 1–2; Section III-B, Eqs. (4–5); Eq. (6); Section IV-B and Algorithm 1"}]
          summary: "A GPU direct solver exploits parallelism across scenarios and prediction horizons to accelerate linear algebra in branch model predictive control."
