        - title: "ML-Guided Primal Heuristics for Mixed Binary Quadratic Programs"
          abstract_id: "arxiv-2604.23053"
          abstract_order: 1
          abstract_summary: "Mixed binary quadratic programs combine discrete decisions with continuous variables and quadratic interactions. This method represents each instance as a tripartite graph and trains graph attention models to predict binary assignments using contrastive and solution-prediction losses. The predictions guide a restricted optimization subproblem, combining learned search guidance with conventional solver refinement."
          image: "images/papers/v6/arxiv-2604.23053.png"
          image_animated: "images/papers/v6/arxiv-2604.23053.svg"
          image_static: "images/papers/v6/arxiv-2604.23053-static.svg"
          image_alt: "Encode the instance as a tripartite graph, predict binary assignments with graph attention, and use predictions to construct a restricted optimization subproblem. Training combines contrastive and weighted cross-entropy losses. Quadratic-aware graph representation and combined solution-prediction training. Motion illustrates algorithm steps or system behavior; it does not reproduce reported numerical results."
          image_fit: "contain"
          abstract_links: [{"text": "Paper", "url": "https://arxiv.org/abs/2604.23053"}]
          abstract_scope: "Illustrative graphical abstract: motion explains the method and does not reproduce measured results or benchmark timing."
          abstract_animation: "The search marker follows existing root, branch, and leaf nodes inside the restricted solver. It holds and resets invisibly for replay; it does not show a guaranteed feasible solution or a measured search run."
          abstract_sources: [{"url": "https://arxiv.org/html/2604.23053v3", "locator": "Methods; Neural Network Architecture; Loss Function; Inference; Fig. 1; Tripartite Graph Representation; GAT; Eq. 6; Inference"}]
          summary: "Learned solution predictions and contrastive training guide primal heuristics for mixed binary quadratic programs, improving solution quality and transfer across problem instances."
          authors: "Weimin Huang, Natalie M. Isenberg, Ján Drgoňa, Draguna L. Vrabie, Bistra Dilkina"
          links:
            - text: "Preprint"
              url: "https://arxiv.org/abs/2604.23053"

        - title: "L2O-CCG: Adversarial Learning with Set Generalization for Adaptive Robust Optimization"
          abstract_id: "arxiv-2603.22548"
          abstract_order: 2
          abstract_summary: "Two-stage adaptive robust optimization requires repeated searches for challenging uncertainty scenarios. L2O-CCG combines a learned recourse surrogate, a learned proximal optimizer, and uncertainty-set projections to guide this search within constraint-and-column generation. Exact recourse evaluation checks selected scenarios before master updates, while the learned update rule can be reused across different uncertainty-set geometries."
          image: "images/papers/v6/arxiv-2603.22548.png"
          image_animated: "images/papers/v6/arxiv-2603.22548.svg"
          image_static: "images/papers/v6/arxiv-2603.22548-static.svg"
          image_alt: "A recourse surrogate supplies gradients to a learned proximal optimizer. Set-specific projection handles uncertainty geometry. An exact recourse solve evaluates the selected scenario before the master update. Reuse a learned update rule while changing the uncertainty-set geometry. Motion illustrates algorithm steps or system behavior; it does not reproduce reported numerical results."
          image_fit: "contain"
          abstract_links: [{"text": "Paper", "url": "https://arxiv.org/abs/2603.22548"}, {"text": "Code", "url": "https://github.com/Zhiyi-miyo/L2O-CCG"}]
          abstract_scope: "Illustrative graphical abstract: motion explains the method and does not reproduce measured results or benchmark timing."
          abstract_animation: "An uncertainty candidate takes a trial step and is projected back onto the depicted set. Exact candidate recourse evaluates the selected scenario before the CCG update. The trajectories illustrate the operation, not trained parameters, convergence rates, or a certified worst-case scenario."
          abstract_sources: [{"url": "https://arxiv.org/html/2603.22548v1", "locator": "Sections III-A, III-B, IV; Algorithm 1; Algorithm 1; Eqs. 9–14; Sections III-A and III-B"}, {"url": "https://github.com/Zhiyi-miyo/L2O-CCG/blob/main/README.md", "locator": "Overview; Repository Structure; Uncertainty Sets"}, {"url": "https://github.com/Zhiyi-miyo/L2O-CCG/blob/main/l2o_ccg.py", "locator": "solve_classical_main_problem; run_l2o_ccg"}]
          summary: "A learned adversarial optimizer accelerates constraint-and-column generation for adaptive robust optimization and generalizes across changing uncertainty sets."
          authors: "Zhiyi Zhou, Ján Drgoňa, Yury Dvorkin"
          links:
            - text: "Preprint"
              url: "https://arxiv.org/abs/2603.22548"

