        - title: "Koopman-Based Linear MPC for Safe Control using Control Barrier Functions"
          abstract_id: "arxiv-2603.21070"
          abstract_order: 21
          abstract_summary: "Nonlinear control-barrier constraints can complicate predictive control optimization. This method augments the system state with its barrier value and learns a joint Koopman predictor for both quantities. Linear relaxed barrier constraints then enter a quadratic program, preserving predicted barrier nonnegativity under the stated initialization conditions while making safety-constrained prediction tractable in the lifted model."
