        - title: "∂CBDs: Differentiable Causal Block Diagrams"
          abstract_id: "arxiv-2602.07581"
          abstract_order: 30
          abstract_summary: "Modular dynamical models need a common language for simulation, learning, and correctness reasoning. Differentiable Causal Block Diagrams translate interconnected causal blocks into an automatic-differentiation execution graph and express assumptions and guarantees as contract constraints. This connects trajectory generation, parameter optimization, and contract residuals within one compositional framework under the stated causal and differentiability conditions."
          image: "images/papers/v6/arxiv-2602.07581.png"
          image_animated: "images/papers/v6/arxiv-2602.07581.svg"
          image_static: "images/papers/v6/arxiv-2602.07581-static.svg"
          image_alt: "Translate composed causal blocks to an automatic-differentiation execution graph and optimize with differentiable contract constraints. Unifies assume–guarantee reasoning and gradient-based learning. Motion illustrates algorithm steps or system behavior; it does not reproduce reported numerical results."
          image_fit: "contain"
          abstract_links: [{"text": "Paper", "url": "https://www.arxiv.org/abs/2602.07581"}, {"text": "Code", "url": "https://github.com/SOLARIS-JHU/Differentiable-CBDs"}]
          abstract_scope: "Illustrative graphical abstract: motion explains the method and does not reproduce measured results or benchmark timing."
          abstract_animation: "Heterogeneous block primitives illustrate Section2.4, rather than a claimed reproduction of a reported case study. The stable focus obeys xdot=[[-0.3,-1],[1,-0.3]]x. The QP solves min0.5[(u-.8)^2+2(v-.8)^2] over0<=u,v<=1,u+v<=1.2. Display speed is remapped along the valid iterate path; it is not wall-clock solver timing. Shrinking colored contours are levels f(x_k) of the same fixed objective."
