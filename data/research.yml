        - title: "SCORE: Statistical Certification of Regions of Attraction via Extreme Value Theory"
          abstract_id: "arxiv-2603.29658"
          abstract_order: 28
          abstract_summary: "Assessing attraction regions becomes difficult for high-dimensional nonlinear systems. SCORE samples large Lyapunov derivatives with stochastic-gradient Langevin dynamics, fits an extreme-value model to block maxima, and bootstraps the estimated finite endpoint. Combined with an independently certified inner region, the procedure provides conditional statistical evidence for accepting or rejecting candidate regions under the stated sampling and inference assumptions."
          image: "images/papers/v6/arxiv-2603.29658.png"
          image_animated: "images/papers/v6/arxiv-2603.29658.svg"
          image_static: "images/papers/v6/arxiv-2603.29658-static.svg"
          image_alt: "Sample large Lyapunov derivatives with PSGLD, fit a GEV model to block maxima, and bootstrap its finite endpoint. Estimates worst-case decrease using extreme-value statistics. Motion illustrates algorithm steps or system behavior; it does not reproduce reported numerical results."
          image_fit: "contain"
          abstract_links: [{"text": "Paper", "url": "https://arxiv.org/abs/2603.29658"}, {"text": "Code", "url": "https://github.com/SOLARIS-JHU/SCORE"}, {"text": "Website", "url": "https://solaris-jhu.github.io/score-website/"}]
          abstract_scope: "Illustrative graphical abstract: motion explains the method and does not reproduce measured results or benchmark timing."
          abstract_animation: "Blue vectors and the teal trajectory use dx=-y, dy=x+(x²−1)y. The local candidate is explicitly illustrative: V=xᵀPx, P=[[1.5,-0.5],[-0.5,1]], with 0.04≤V≤0.38. Purple samples follow projected noisy ascent of Vdot in z=Lᵀx, P=LLᵀ, where exact annular projection is simple. Block markers select actual maxima of the local demonstration's 21 chain endpoints. The GEV is an illustrative density with mu=-0.24, sigma=0.04, xi=-0.5, not a fit to published data or the small demonstration sample; U=-0.08 is a schematic confidence-bound position."
          abstract_sources: [{"url": "https://arxiv.org/html/2603.29658v2", "locator": "Sections III-B–III-E; Corollary 1; Algorithm 1; §II; Eq. (1); §III-C block maxima and confidence estimation; Corollary 1"}, {"url": "https://github.com/SOLARIS-JHU/SCORE/blob/main/experiments/van_der_pol/EVT/verify_evt_new.py", "locator": "compute_V_Vdot, volume_attack_batch, analyze_evt_block_maxima"}, {"url": "https://github.com/SOLARIS-JHU/SCORE/blob/main/README.md", "locator": "What the results mean"}, {"url": "https://github.com/SOLARIS-JHU/SCORE/blob/main/experiments/van_der_pol/EVT/commons.py", "locator": "VanDerPol.vector_field; mu=1.0."}, {"url": "https://github.com/SOLARIS-JHU/SCORE/blob/main/experiments/van_der_pol/EVT/verify_evt_sos_new.py", "locator": "compute_V_Vdot and volume_attack_batch; ascent versus physical flow."}]
